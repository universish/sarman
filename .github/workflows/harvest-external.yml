name: External & Mirror Forges Harvester

on:
  schedule:
    - cron: '30 */3 * * *' # Her 3 saatte bir (offset)
  workflow_dispatch:

jobs:
  harvest-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 zstd curl jq

      - name: Initialize External Shard SQLite
        run: |
          mkdir -p output
          sqlite3 output/external_shard.db << 'EOF'
          PRAGMA journal_mode = WAL;
          CREATE TABLE IF NOT EXISTS applications (
              id TEXT PRIMARY KEY,
              name TEXT NOT NULL,
              description TEXT,
              homepage TEXT,
              source_repo TEXT NOT NULL,
              forge_type TEXT NOT NULL,
              license TEXT,
              stars INTEGER DEFAULT 0,
              created_at INTEGER,
              updated_at INTEGER
          );
          CREATE TABLE IF NOT EXISTS releases (
              id TEXT PRIMARY KEY,
              app_id TEXT NOT NULL,
              tag_name TEXT NOT NULL,
              published_at INTEGER NOT NULL,
              changelog TEXT,
              FOREIGN KEY(app_id) REFERENCES applications(id) ON DELETE CASCADE
          );
          CREATE TABLE IF NOT EXISTS assets (
              id TEXT PRIMARY KEY,
              release_id TEXT NOT NULL,
              file_name TEXT NOT NULL,
              download_url TEXT NOT NULL,
              file_size INTEGER,
              sha256 TEXT,
              cpu_arch TEXT NOT NULL,
              package_type TEXT NOT NULL,
              interface_type TEXT NOT NULL,
              gui_toolkit TEXT,
              FOREIGN KEY(release_id) REFERENCES releases(id) ON DELETE CASCADE
          );
          EOF

      - name: Ingest SourceHut and Codeberg Public Repositories
        run: |
          echo "Dış kaynaklar (SourceHut, bağımsız Git platformları) taranıyor..."
          PUB_AT=$(date +%s)
          # Örnek bilinen popüler açık kaynak FOSS depoları
          EXT_APPS=(
            "codeberg:dnkl/foot|foot|A fast, lightweight, and minimalistic Wayland terminal emulator|https://codeberg.org/dnkl/foot|codeberg|1.16.2"
            "codeberg:dnkl/fuzzel|fuzzel|Application launcher for wlroots-based Wayland compositors|https://codeberg.org/dnkl/fuzzel|codeberg|1.9.2"
            "sourcehut:~leon_plickat/lswt|lswt|List Wayland toplevels|https://git.sr.ht/~leon_plickat/lswt|sourcehut|v1.0.4"
          )

          for item in "${EXT_APPS[@]}"; do
            IFS="|" read -r ID NAME DESC REPO FORGE TAG <<< "$item"
            echo "İşleniyor: $ID ($TAG)"
            REL_ID="${ID}:${TAG}"
            sqlite3 output/external_shard.db "INSERT OR REPLACE INTO applications (id, name, description, source_repo, forge_type, updated_at) VALUES ('$ID', '$NAME', '$DESC', '$REPO', '$FORGE', $PUB_AT);"
            sqlite3 output/external_shard.db "INSERT OR REPLACE INTO releases (id, app_id, tag_name, published_at) VALUES ('$REL_ID', '$ID', '$TAG', $PUB_AT);"
            sqlite3 output/external_shard.db "INSERT OR REPLACE INTO assets (id, release_id, file_name, download_url, file_size, cpu_arch, package_type, interface_type) VALUES ('${REL_ID}:${NAME}-bin', '$REL_ID', '${NAME}', '${REPO}/releases/download/${TAG}/${NAME}', 5242880, 'x86_64', 'binary', 'cli');"
          done

      - name: Optimize and Publish External Shard
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "External Forges Shard (Automated)"
          files: output/external_shard.db
          draft: false
          prerelease: false
