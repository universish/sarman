name: External & Mirror Forges Harvester

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '30 */3 * * *' # Her 3 saatte bir (offset)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 zstd curl jq

      - name: Execute External Harvester Engine
        run: |
          mkdir -p output
          chmod +x scripts/harvest-external.sh
          ./scripts/harvest-external.sh output/external_shard.db

      - name: Optimize and Publish External Shard
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "External Forges Shard (Automated)"
          files: output/external_shard.db
          draft: false
          prerelease: false
